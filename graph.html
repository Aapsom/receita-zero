<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Codebase Graph - Receita Zero</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #0a0a10; color: #e4e4ed; }
    #graph { width: 100vw; height: 100vh; }
    .node { cursor: pointer; }
    .node circle { stroke: #fff; stroke-width: 2px; }
    .link { stroke-opacity: 0.3; }
    .legend { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 5px; }
    .stats { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 5px; }
  </style>
</head>
<body>
  <div class="stats">
    <div><strong>Nós:</strong> <span id="node-count">0</span></div>
    <div><strong>Arestas:</strong> <span id="edge-count">0</span></div>
    <div><strong>Linguagens:</strong> <span id="lang-count">0</span></div>
  </div>
  <div id="graph"></div>
  <div class="legend">
    <div><strong>Labels:</strong></div>
    <div id="labels"></div>
  </div>
  <script>
    fetch('graph.json')
      .then(r => r.json())
      .then(data => {
        const width = document.getElementById('graph').clientWidth;
        const height = document.getElementById('graph').clientHeight;
        
        // Parsear o formato estruturado do codebase-memory-mcp
        const summary = data.structuredContent || data.summary || {};
        const nodeLabels = summary.node_labels || [];
        const edgeTypes = summary.edge_types || [];
        const languages = summary.languages || [];
        
        // Atualizar estatísticas
        document.getElementById('node-count').textContent = summary.total_nodes || 0;
        document.getElementById('edge-count').textContent = summary.total_edges || 0;
        document.getElementById('lang-count').textContent = languages.length;
        
        // Mostrar labels
        const labelsDiv = document.getElementById('labels');
        nodeLabels.forEach(label => {
          const div = document.createElement('div');
          div.innerHTML = `<span style="color:#${Math.floor(Math.random()*16777215).toString(16)}">${label.label}: ${label.count}</span>`;
          labelsDiv.appendChild(div);
        });
        
        // Criar nós simulados para visualização
        const nodes = [];
        const links = [];
        
        // Distribuir nós em círculos por label
        const radius = Math.min(width, height) / 3;
        nodeLabels.forEach((label, i) => {
          const count = Math.min(label.count, 50); // Limitar para visualização
          for (let j = 0; j < count; j++) {
            const angle = (j / count) * 2 * Math.PI;
            const groupRadius = radius * (i / nodeLabels.length + 0.5);
            nodes.push({
              id: `${label.label}_${j}`,
              name: label.label,
              group: label.label.toLowerCase(),
              x: width/2 + Math.cos(angle) * groupRadius,
              y: height/2 + Math.sin(angle) * groupRadius,
              count: label.count
            });
          }
        });
        
        // Criar arestas simuladas
        edgeTypes.forEach((edge, i) => {
          const count = Math.min(edge.count, 50);
          for (let j = 0; j < count; j++) {
            if (nodes.length > 1) {
              const source = nodes[j % nodes.length];
              const target = nodes[(j + 1) % nodes.length];
              links.push({
                source: source.id,
                target: target.id,
                type: edge.type,
                count: edge.count
              });
            }
          }
        });
        
        // Renderizar grafo
        const svg = d3.select('#graph')
          .append('svg')
          .attr('width', width)
          .attr('height', height);
        
        const link = svg.selectAll('line')
          .data(links)
          .enter()
          .append('line')
          .attr('stroke', '#666')
          .attr('stroke-opacity', 0.2)
          .attr('stroke-width', 1);
        
        const node = svg.selectAll('circle')
          .data(nodes)
          .enter()
          .append('circle')
          .attr('r', 8)
          .attr('fill', (d, i) => d3.schemeCategory10[i % 10])
          .attr('cx', d => d.x)
          .attr('cy', d => d.y)
          .on('mouseover', function(event, d) {
            d3.select(this).attr('r', 12);
          })
          .on('mouseout', function(event, d) {
            d3.select(this).attr('r', 8);
          });
        
        const simulation = d3.forceSimulation(nodes)
          .force('link', d3.forceLink(links).id(d => d.id).distance(80))
          .force('charge', d3.forceManyBody().strength(-100))
          .force('center', d3.forceCenter(width/2, height/2))
          .stop();
        
        // Aplicar forças manualmente (simulação não funciona bem com posições já definidas)
        for (let i = 0; i < 300; i++) {
          simulation.tick();
        }
        
        node.attr('cx', d => d.x).attr('cy', d => d.y);
        link.attr('x1', d => nodes.find(n => n.id === d.source)?.x || width/2)
             .attr('y1', d => nodes.find(n => n.id === d.source)?.y || height/2)
             .attr('x2', d => nodes.find(n => n.id === d.target)?.x || width/2)
             .attr('y2', d => nodes.find(n => n.id === d.target)?.y || height/2);
      })
      .catch(err => {
        document.getElementById('graph').innerHTML = '<div style="padding:20px">Erro ao carregar gráfico: ' + err.message + '</div>';
      });
  </script>
</body>
</html>
